name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build .\src\Shizi\Shizi.csproj --configuration Release
      - name: Smoke tests
        run: dotnet run --project .\tests\Shizi.SmokeTests\Shizi.SmokeTests.csproj --configuration Release
